<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class7->HW</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 50vw;
            margin: auto;
            background-color: #d2cecc;
            border: 1px solid #00000017;
            border-radius: 15px;
            box-shadow: 0px 0px 10px #0000004d;
        }

        #h1 {
            margin: 20px 0px;
            font-size: 50px;
            font-variant: small-caps;
            font-family: system-ui;
            text-shadow: 0px 0px 70px #000000;
        }

        #form_rg {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lev {
            display: flex;
            flex-direction: row;
            width: 100%;
            align-items: center;
            font-size: 17px;
            font-family: system-ui;
            font-weight: 700;
            margin-top: 5px;
        }

        .infeld {
            height: 30px;
            width: 60%;
            border: 1px solid #00000026;
            border-radius: 10px;
            box-shadow: 0px 0px 5px #00000082;
            margin-left: 5px;
        }

        .op {
            font-weight: 700;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 15px;
            font-size: 17px;
            font-family: system-ui;
        }

        .p {
            font-size: 15px;
            font-weight: 600;
        }

        .sein {
            height: 30px;
            width: 30%;
            border: 1px solid #00000026;
            border-radius: 10px;
            box-shadow: 0px 0px 5px #00000082;
            margin-left: 10px;
        }

        #box {
            height: 100px;
            margin-top: 7px;
            width: 90%;
            border: 1px solid #cacaca;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #00000045;
        }

        .ope {
            font-weight: 700;
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 15px;
            font-size: 17px;
            font-family: system-ui;
        }

        .btn {
            color: white;
            height: 40px;
            width: 90px;
            font-variant: small-caps;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 1px solid #9d9d9d8f;
            background-color: #5D4037;
            box-shadow: 0px 0px 10px #655e5e;
            margin: 0px 5px;
        }

        .btn:hover {
            color: rgb(42, 248, 255);
            text-shadow: 0px 0px 10px aqua;
            box-shadow: 0px 0px 10px #000000c2;
            transform: scale(.96);
            transition-duration: .5s;
        }

        .opo {
            font-weight: 700;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            margin: 25px 0px;
            font-size: 17px;
            font-family: system-ui;
        }

        .ho:hover {

            box-shadow: 0px 0px 10px #000000c9;
            transform: scale(.98);
            transition-duration: .5s;
        }
    </style>
</head>

<body>
    <section class="container">
        <h1 id="h1">Regstation Form</h1>
        <form action="" id="form_rg">
            <label for="text" class="lev">
                Enter Your Name:
                <input type="text" class="infeld ho" placeholder="  Full Name" required>
            </label>
            <label for="email" class="lev">
                Enter Your Email:
                <input type="email" class="infeld ho" placeholder=" Email Address" required>
            </label>
            <label for="text" class="lev">
                Enter Your Address:
                <input type="text" class="infeld ho" placeholder=" Enter Your Address" required>
            </label>
            <label for="radio" class="op">
                Gender:
                <input type="radio" name="radio" id="radio_button" value="Male">
                <option value="radio" class="p">Male</option>
                <input type="radio" name="radio" id="radio_button" value="Female">
                <option value="radio" class="p">Female</option>
            </label>
            <label for="" class="op">
                Hobby:
                <input type="checkbox" name="checkbox" value="bike">
                <option value="bike" class="p">Bike</option>
                <input type="checkbox" name="checkbox" value="reading">
                <option value="reading" class="p">Reading</option>
                <input type="checkbox" name="checkbox" value="swimming">
                <option value="swimming" class="p">Swimming</option>
                <input type="checkbox" name="checkbox" value="sleeping">
                <option value="sleeping" class="p">Sleeping</option>
            </label>
            <label for="select" class="op">
                Select Your Mobile Model:
                <select name="select" class="sein ho" placeholder="Choose one">
                    <option value="Apple">Apple</option>
                    <option value="samsung">Samsung</option>
                    <option value="OnePlus">OnePlus</option>
                    <option value="Nokia">Nokia</option>
                    <option value="Motorola">Motorola</option>
                    <option value="Realme">Realme</option>
                    <option value="Vivo">Vivo</option>
                    <option value="OPPO">OPPO</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="Honor">Honor</option>
                    <option value="Tecno">Tecno</option>
                    <option value="Infinix">Infinix</option>
                    <option value="Lenovo">Lenovo</option>

                </select>
            </label>
            <label for="textarea" class="ope">
                Write Somethink About you:
                <textarea name="textarea" class="ho" id="box">

                </textarea>
            </label>
            <label for="button" class="opo">
                <input class="btn" type="reset" value="restart">
                <input class="btn" type="button" value="Submit">
            </label>
        </form>
    </section>

</body>

</html>
