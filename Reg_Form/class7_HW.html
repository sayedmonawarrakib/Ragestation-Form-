<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regstrstion_Form</title>
</head>

<body>
    <section class="container">
        <h1 id="h1">Regstation Form</h1>
        <form action="" id="form_rg">
            <label for="text" class="lev">
                Enter Your Name:
                <input type="text" class="infeld ho" placeholder="  Full Name" required>
            </label>
            <label for="email" class="lev">
                Enter Your Email:
                <input type="email" class="infeld ho" placeholder=" Email Address" required>
            </label>
            <label for="text" class="lev">
                Enter Your Address:
                <input type="text" class="infeld ho" placeholder=" Enter Your Address" required>
            </label>
            <label for="radio" class="op">
                Gender:
                <input type="radio" name="radio" id="radio_button" value="Male">
                <option value="radio" class="p">Male</option>
                <input type="radio" name="radio" id="radio_button" value="Female">
                <option value="radio" class="p">Female</option>
            </label>
            <label for="" class="op">
                Hobby:
                <input type="checkbox" name="checkbox" value="bike">
                <option value="bike" class="p">Bike</option>
                <input type="checkbox" name="checkbox" value="reading">
                <option value="reading" class="p">Reading</option>
                <input type="checkbox" name="checkbox" value="swimming">
                <option value="swimming" class="p">Swimming</option>
                <input type="checkbox" name="checkbox" value="sleeping">
                <option value="sleeping" class="p">Sleeping</option>
            </label>
            <label for="select" class="op">
                Select Your Mobile Model:
                <select name="select" class="sein ho" placeholder="Choose one">
                    <option value="Apple">Apple</option>
                    <option value="samsung">Samsung</option>
                    <option value="OnePlus">OnePlus</option>
                    <option value="Nokia">Nokia</option>
                    <option value="Motorola">Motorola</option>
                    <option value="Realme">Realme</option>
                    <option value="Vivo">Vivo</option>
                    <option value="OPPO">OPPO</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="Honor">Honor</option>
                    <option value="Tecno">Tecno</option>
                    <option value="Infinix">Infinix</option>
                    <option value="Lenovo">Lenovo</option>

                </select>
            </label>
            <label for="textarea" class="ope">
                Write Somethink About you:
                <textarea name="textarea" class="ho" id="box">

                </textarea>
            </label>
            <label for="button" class="opo">
                <input class="btn" type="reset" value="restart">
                <input class="btn" type="button" value="Submit">
            </label>
        </form>
    </section>

</body>


</html>
